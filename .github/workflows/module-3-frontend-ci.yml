name: Module 3 Frontend CI

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/module-3-frontend-ci.yml"
  push:
    branches:
      - "feat/module-3-source-intelligence-upgrade"
    paths:
      - "frontend/**"
      - ".github/workflows/module-3-frontend-ci.yml"

permissions:
  contents: read

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint frontend
        run: npm run lint
      - name: Build frontend
        run: npm run build
