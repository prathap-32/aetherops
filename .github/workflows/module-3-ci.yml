name: Module 3 Source Analysis CI

on:
  pull_request:
    paths:
      - "services/source_code_analyzer/**"
      - "migrations/**"
      - ".github/workflows/module-3-ci.yml"
  push:
    branches:
      - "feat/module-3-source-intelligence-upgrade"
    paths:
      - "services/source_code_analyzer/**"
      - "migrations/**"
      - ".github/workflows/module-3-ci.yml"

permissions:
  contents: read

jobs:
  source-analysis-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/source_code_analyzer
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install service and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Compile service modules
        run: python -m compileall -q app
      - name: Run Module 3 tests
        run: pytest -q
