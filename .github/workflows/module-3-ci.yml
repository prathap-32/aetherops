name: Module 3 Source Analysis CI

on:
  pull_request:
    paths:
      - "services/source_code_analyzer/**"
      - "migrations/**"
      - ".github/workflows/module-3-ci.yml"
  push:
    branches:
      - "feat/module-3-source-intelligence-upgrade"
    paths:
      - "services/source_code_analyzer/**"
      - "migrations/**"
      - ".github/workflows/module-3-ci.yml"

permissions:
  contents: read

jobs:
  source-analysis-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/source_code_analyzer
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install service and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "fastapi>=0.110.0" "uvicorn>=0.28.0" "pydantic>=2.6.0" "httpx>=0.27.0" "rich>=13.0.0" "pyyaml>=6.0.0" "sqlalchemy[asyncio]>=2.0.0" "asyncpg>=0.29.0" "aiosqlite>=0.19.0" "PyJWT>=2.8.0" "pytest>=8.0.0" "pytest-asyncio>=0.23.0"
          echo "PYTHONPATH=$PWD" >> "$GITHUB_ENV"
      - name: Compile service modules
        run: python -m compileall -q app
      - name: Run Module 3 tests
        run: pytest -q
