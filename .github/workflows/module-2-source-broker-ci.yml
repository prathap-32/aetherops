name: Module 2 Source Broker CI

on:
  pull_request:
    paths:
      - "services/source_cloud_git_service/**"
      - ".github/workflows/module-2-source-broker-ci.yml"
  push:
    branches:
      - "feat/module-3-source-intelligence-upgrade"
    paths:
      - "services/source_cloud_git_service/**"
      - ".github/workflows/module-2-source-broker-ci.yml"

permissions:
  contents: read

jobs:
  source-broker-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/source_cloud_git_service
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Module 2 dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          echo "PYTHONPATH=$PWD" >> "$GITHUB_ENV"
      - name: Compile service modules
        run: python -m compileall -q app
      - name: Run credential broker tests
        run: pytest -q
