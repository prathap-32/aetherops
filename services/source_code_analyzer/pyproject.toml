[project]
name = "repo-analyzer-service"
version = "1.0.0"
description = "AetherOps AI - Module 3: Repository Analyzer Service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
    "rich>=13.0.0",
    "pyyaml>=6.0.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.19.0",
    "PyJWT>=2.8.0",
]

# [tool.uv.sources]
# repo-analyzer = { path = "../../../repo_analyzer", editable = true }

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
