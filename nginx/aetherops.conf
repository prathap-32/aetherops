# nginx/aetherops.conf
# ==============================================================================
# AETHEROPS AI - NEW ARCHITECTURE: AUTH SEPARATION + NGINX REVERSE PROXY
# ==============================================================================
# User Flow:
# 1. User → Port 7999 (Auth Service - Login/Signup)
# 2. Login Success → Port 8000 (Unified Dashboard)
# 3. Dashboard → Nginx → Backend Modules (8001+)
# ==============================================================================

# Upstream Definitions
upstream aether_auth {
    server 127.0.0.1:7999 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

upstream aether_dashboard {
    server 127.0.0.1:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream aether_projects {
    server 127.0.0.1:8001 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

# ==============================================================================
# SERVER: Port 80 → Nginx Reverse Proxy (Dashboard + APIs)
# ==============================================================================
server {
    listen 80;
    server_name localhost;

    client_max_body_size 50M;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    # Proxy Headers
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Projects & Environments API → Port 8001
    location /api/v1/projects {
        proxy_pass http://aether_projects;
    }

    # Static Assets
    location /assets/ {
        proxy_pass http://aether_dashboard;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Dashboard (default)
    location / {
        proxy_pass http://aether_dashboard;
    }
}
