# nginx/aetherops.conf
# ==============================================================================
# AETHEROPS AI - UNIFIED REVERSE PROXY & API GATEWAY NGINX CONFIGURATION
# ==============================================================================
# Purpose:
# Routes all public requests from one external domain (HTTPS / HTTP) to the
# 11 internal independent AetherOps microservices, strictly isolating internal ports.
#
# Route Mapping:
# /                              -> Main Application & Frontend Shell (Port 8000)
# /auth/google/*                 -> Google Authentication Service (Port 8009)
# /auth/github/*                 -> GitHub Connection Service (Port 8010)
# /api/v1/auth/github/*          -> GitHub Connection Service (Port 8010)
# /api/v1/auth/*                 -> Project & User Session Manager (Port 8009)
# /api/v1/projects/*             -> Project & Environment Manager (Port 8009)
# /api/v1/connections/*          -> Source & Cloud Connection (Port 8010)
# /api/v1/cloud/*                -> Source & Cloud Connection (Port 8010)
# /api/v1/github/*               -> Source & Cloud Connection (Port 8010)
# /api/v1/source/*               -> Source & Cloud Connection (Port 8010)
# /api/v1/repo/*                 -> Requirement Analysis & Repo Sizing (Port 8001)
# /api/v1/requirements/*         -> Requirement Analysis & Sizing (Port 8001)
# /api/v1/architecture/*         -> Architecture Graph Generator (Port 8002)
# /api/v1/iac/*                  -> Terraform / IaC Synthesizer (Port 8003)
# /api/v1/terraform/*            -> Terraform / IaC Synthesizer (Port 8003)
# /api/v1/finops/*               -> FinOps Cost Optimizer (Port 8004)
# /api/v1/security/*             -> Security & CIS Benchmark Scanner (Port 8005)
# /api/v1/cicd/*                 -> CI/CD GitOps Pipeline Engine (Port 8006)
# /api/v1/monitoring/*           -> Observability & APM Setup (Port 8007)
# /api/v1/observability/*        -> Observability & APM Setup (Port 8007)
# /api/v1/deployments/*          -> Cloud Deployer & Drift Engine (Port 8008)
# /api/admin/*                   -> Admin Console & Regional Catalog (Port 8000)
# ==============================================================================

# Microservice Upstream Definitions
upstream aether_main_app {
    server 127.0.0.1:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream aether_project_manager {
    server 127.0.0.1:8001 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream aether_source_connection {
    server 127.0.0.1:8002 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream aether_repo_analyzer {
    server 127.0.0.1:8003 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

upstream aether_requirement_analysis {
    server 127.0.0.1:8004 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

upstream aether_architecture_generator {
    server 127.0.0.1:8005 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

upstream aether_iac_generator {
    server 127.0.0.1:8006 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

upstream aether_finops_optimizer {
    server 127.0.0.1:8007 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

upstream aether_security_scanner {
    server 127.0.0.1:8008 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

upstream aether_cicd_pipeline {
    server 127.0.0.1:8009 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

upstream aether_observability_setup {
    server 127.0.0.1:8010 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

upstream aether_cloud_deployer {
    server 127.0.0.1:8011 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

upstream aether_admin_console {
    server 127.0.0.1:8012 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name localhost 127.0.0.1 aetherops.local *.aetherops.cloud;

    # Client upload limits
    client_max_body_size 50M;

    # Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    # Proxy Headers configuration
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    # Timeouts
    proxy_connect_timeout 30s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # 1. Google OAuth Initiation & Callback (Port 8009)
    location /auth/google/ {
        proxy_pass http://aether_project_manager/auth/google/;
    }

    # 2. GitHub OAuth Initiation & Callback (Port 8010)
    location /auth/github/ {
        proxy_pass http://aether_source_connection/auth/github/;
    }

    # 3. Microservice APIs
    # GitHub Auth API
    location /api/v1/auth/github/ {
        proxy_pass http://aether_source_connection/api/v1/auth/github/;
    }

    # General User & Session Auth API (Port 8009)
    location /api/v1/auth/ {
        proxy_pass http://aether_project_manager/api/v1/auth/;
    }

    # Projects & Environments API (Port 8009)
    location /api/v1/projects {
        proxy_pass http://aether_project_manager/api/v1/projects;
    }

    # Source & Cloud Connection APIs (Port 8010)
    location /api/v1/connections {
        proxy_pass http://aether_source_connection/api/v1/connections;
    }
    location /api/v1/cloud/ {
        proxy_pass http://aether_source_connection/api/v1/cloud/;
    }
    location /api/v1/github/ {
        proxy_pass http://aether_source_connection/api/v1/github/;
    }
    location /api/v1/source/ {
        proxy_pass http://aether_source_connection/api/v1/source/;
    }

    # Requirement Analysis & Repo Analyzer API (Port 8001)
    location /api/v1/repo/ {
        proxy_pass http://aether_requirement_analysis/api/v1/repo/;
    }
    location /api/v1/requirements {
        proxy_pass http://aether_requirement_analysis/api/v1/requirements;
    }

    # Architecture Graph Generator API (Port 8002)
    location /api/v1/architecture/ {
        proxy_pass http://aether_architecture_generator/api/v1/;
    }

    # IaC & Terraform Synthesizer API (Port 8003)
    location /api/v1/iac/ {
        proxy_pass http://aether_iac_generator/api/v1/;
    }
    location /api/v1/terraform/ {
        proxy_pass http://aether_iac_generator/api/v1/;
    }

    # FinOps Cost Optimizer API (Port 8004)
    location /api/v1/finops/ {
        proxy_pass http://aether_finops_optimizer/api/v1/;
    }

    # Security & CIS Benchmark Scanner API (Port 8005)
    location /api/v1/security/ {
        proxy_pass http://aether_security_scanner/api/v1/;
    }

    # CI/CD Pipeline Engine API (Port 8006)
    location /api/v1/cicd/ {
        proxy_pass http://aether_cicd_pipeline/api/v1/;
    }

    # Observability & APM Setup API (Port 8007)
    location /api/v1/monitoring/ {
        proxy_pass http://aether_observability_setup/api/v1/;
    }
    location /api/v1/observability/ {
        proxy_pass http://aether_observability_setup/api/v1/;
    }

    # Cloud Deployer & Drift Engine API (Port 8008)
    location /api/v1/deployments/ {
        proxy_pass http://aether_cloud_deployer/api/v1/;
    }

    # Admin Console Privileged APIs (Port 8012)
    location /api/admin/ {
        proxy_pass http://aether_admin_console/api/admin/;
    }

    # Static Assets Fast Caching
    location /assets/ {
        proxy_pass http://aether_main_app/assets/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    location /static/ {
        proxy_pass http://aether_main_app/static/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # 4. Default: Main Application & Unified Frontend Shell (Port 8000)
    location / {
        proxy_pass http://aether_main_app;
    }
}
